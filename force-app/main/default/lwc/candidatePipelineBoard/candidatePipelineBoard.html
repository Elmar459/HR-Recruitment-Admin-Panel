<template>
    <lightning-card title="Candidate Pipeline Board" icon-name="standard:kanban">
        <div class="toolbar slds-p-horizontal_medium slds-p-top_small">
            <lightning-input
                type="search"
                label="Filter"
                variant="label-hidden"
                placeholder="Filter candidates or positions"
                value={searchTerm}
                onchange={handleSearch}>
            </lightning-input>
            <div class="toolbar-actions">
                <lightning-button-icon
                    icon-name="utility:filterList"
                    alternative-text="Toggle filters"
                    title="Toggle filters"
                    onclick={handleToggleFilters}>
                </lightning-button-icon>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh board"
                    title="Refresh board"
                    onclick={handleRefresh}
                    disabled={isBusy}>
                </lightning-button-icon>
            </div>
        </div>

        <template if:true={showFilters}>
            <div class="filters slds-p-horizontal_medium slds-p-vertical_small">
                <div class="filter-row">
                    <lightning-combobox
                        label="Department"
                        value={departmentFilter}
                        options={departmentOptions}
                        onchange={handleDepartmentFilterChange}>
                    </lightning-combobox>
                    <lightning-combobox
                        label="Recruiter"
                        value={recruiterFilter}
                        options={recruiterOptions}
                        onchange={handleRecruiterFilterChange}>
                    </lightning-combobox>
                    <lightning-combobox
                        label="Position"
                        value={positionFilter}
                        options={positionOptions}
                        onchange={handlePositionFilterChange}>
                    </lightning-combobox>
                    <lightning-input
                        type="date"
                        label="From Date"
                        value={dateFromFilter}
                        onchange={handleDateFromFilterChange}>
                    </lightning-input>
                    <lightning-input
                        type="date"
                        label="To Date"
                        value={dateToFilter}
                        onchange={handleDateToFilterChange}>
                    </lightning-input>
                    <lightning-combobox
                        label="SLA Status"
                        value={slaStatusFilter}
                        options={slaStatusOptions}
                        onchange={handleSlaStatusFilterChange}>
                    </lightning-combobox>
                </div>

                <div class="filter-toggles">
                    <lightning-input
                        type="checkbox"
                        label="Top Matches (≥70%)"
                        checked={showTopMatches}
                        onchange={handleTopMatchesToggle}>
                    </lightning-input>
                    <lightning-input
                        type="checkbox"
                        label="Sort by Score"
                        checked={sortByScore}
                        onchange={handleSortByScoreToggle}>
                    </lightning-input>
                </div>
            </div>
        </template>

        <div class="bulk-actions slds-p-horizontal_medium slds-p-vertical_small">
            <lightning-button
                label="Mass Reject"
                icon-name="utility:close"
                variant="destructive-text"
                onclick={handleMassReject}
                disabled={isBusy}>
            </lightning-button>
            <lightning-button
                label="Mass Advance"
                icon-name="utility:forward"
                variant="success"
                onclick={handleMassAdvance}
                disabled={isBusy}>
            </lightning-button>
            <span class="selection-count">({selectedApplicationIds.size} selected)</span>
        </div>

        <template if:true={errorMessage}>
            <div class="slds-p-around_medium">
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span>{errorMessage}</span>
                </div>
            </div>
        </template>

        <div class="board slds-p-around_medium">
            <template for:each={visibleStages} for:item="stage">
                <section
                    key={stage.name}
                    class="stage"
                    data-status={stage.name}
                    ondragover={handleDragOver}
                    ondrop={handleDrop}>
                    <header class="stage__header">
                        <h3>{stage.name}</h3>
                        <span>{stage.count}</span>
                    </header>

                    <div class="stage__body">
                        <template for:each={stage.applications} for:item="app">
                            <article
                                key={app.id}
                                class={app.cardClass}
                                draggable="true"
                                data-id={app.id}
                                ondragstart={handleDragStart}
                                onclick={handleCardSelect}>
                                <div class="card__topline">
                                    <strong>{app.candidateName}</strong>
                                    <span class={app.scoreClass}>{app.matchLabel}</span>
                                    <template if:true={app.slaBreached}>
                                        <lightning-icon
                                            icon-name="utility:clock"
                                            size="small"
                                            class="sla-icon">
                                        </lightning-icon>
                                    </template>
                                </div>
                                <p>{app.positionName}</p>
                                <div class="card__meta">
                                    <span>{app.priorityLabel}</span>
                                    <span>{app.daysLabel}</span>
                                </div>
                            </article>
                        </template>

                        <template if:true={stage.isEmpty}>
                            <div class="empty">No applications</div>
                        </template>
                    </div>
                </section>
            </template>
        </div>

        <template if:true={showBulkModal}>
            <div class="modal-backdrop">
                <div class="modal">
                    <div class="modal-header">
                        <h2>Confirm Bulk Action</h2>
                    </div>
                    <div class="modal-body">
                        <p>Are you sure you want to {bulkAction} {selectedApplicationIds.size} applications?</p>
                    </div>
                    <div class="modal-footer">
                        <lightning-button
                            label="Cancel"
                            onclick={handleBulkCancel}>
                        </lightning-button>
                        <lightning-button
                            label="Confirm"
                            variant="brand"
                            onclick={handleBulkConfirm}
                            disabled={isBusy}>
                        </lightning-button>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
