<template>
    <lightning-card>
        <div class="summary-grid">
            <!-- Левая колонка: фото -->
            <div class="summary-photo-col">
                <div class="photo-container">
                    <template if:true={candidateInfo.photoUrl}>
                        <img src={candidateInfo.photoUrl} class="candidate-photo" alt="Candidate" />
                    </template>
                    <template if:false={candidateInfo.photoUrl}>
                        <lightning-icon icon-name="standard:avatar" size="x-large"
                            class="avatar-placeholder"></lightning-icon>
                    </template>
                    <lightning-button label="Upload Photo" variant="neutral" size="x-small" onclick={handleUploadClick}
                        disabled={isLoadingPhoto} class="slds-m-top_x-small">
                    </lightning-button>
                </div>
            </div>

            <!-- Правая колонка -->
            <div class="summary-info-col">
                <!-- Имя и контакты -->
                <div class="summary-header">
                    <h2 class="slds-text-heading_medium">{candidateInfo.firstName} {candidateInfo.lastName}</h2>
                    <div class="contact-icons">
                        <template if:true={candidateInfo.phone}>
                            <a href="tel:{candidateInfo.phone}" class="contact-icon" title="Phone">
                                <img src={phoneIconUrl} class="custom-icon" alt="Phone" />
                            </a>
                        </template>
                        <template if:true={candidateInfo.linkedInUrl}>
                            <a href={candidateInfo.linkedInUrl} target="_blank" class="contact-icon" title="LinkedIn">
                                <img src={linkedinIconUrl} class="custom-icon" alt="LinkedIn" />
                            </a>
                        </template>
                    </div>
                </div>

                <!-- Метрики выбранной заявки -->
                <div class="summary-metrics">
                    <div class="metric">
                        <span class="metric-label">Stage:</span>
                        <span class="metric-value {selectedStage === 'Rejected' ? 'stage-rejected' : ''}">
                            {selectedStage}
                        </span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Applied:</span>
                        <span class="metric-value">{selectedAppliedDate}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Days in stage:</span>
                        <span class="metric-value">{selectedDaysInStage}</span>
                    </div>
                </div>

                <!-- Прогресс этапов -->
                <div class="stage-progress">
                    <span class="metric-label">Progress:</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style={stageProgressStyle}></div>
                    </div>
                    <span class="metric-value">{stageProgressPercent}%
                        ({selectedStageOrder}/{selectedTotalStages})</span>
                </div>

                <!-- Ближайшее интервью -->
                <div if:true={nextInterview} class="next-interview">
                    <lightning-icon icon-name="utility:event" size="x-small"></lightning-icon>
                    <span>Next: {nextInterview.type} · {formattedNextInterviewDate}</span>
                </div>

                <!-- Кнопки-позиции (Sales Manager, IT Manager) -->
                <div class="positions">
                    <template for:each={uniquePositions} for:item="pos">
                        <button key={pos.id} class={pos.buttonClass} onclick={selectPosition} data-position-id={pos.id}>
                            {pos.name}
                        </button>
                    </template>
                </div>

                <!-- Список заявок для выбранной позиции -->
                <div class="applications-list">
                    <div class="section-label">Applications</div>
                    <div class="application-links">
                        <template for:each={filteredApplications} for:item="app">
                            <a key={app.id} href="javascript:void(0)" class={app.linkClass}
                                onclick={navigateToApplication} data-id={app.id}>
                                {app.applicationNumber}
                            </a>
                        </template>
                        <template if:true={showNoApplicationsMessage}>
                            <span class="no-applications">No applications for this position</span>
                        </template>
                    </div>
                </div>

                <!-- Top Skills -->
                <div if:true={topSkills.length} class="top-skills">
                    <div class="section-label">Top Skills</div>
                    <div class="skills-list">
                        <template for:each={topSkills} for:item="skill">
                            <span key={skill.name} class="skill-chip" data-id={skill.candidateSkillId}
                                onclick={navigateToSkill}>
                                {skill.name}
                            </span>
                        </template>
                    </div>
                </div>

                <!-- Match Score -->
                <div class="match-score-centered">
                    <span class="metric-label">Match Score:</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style={progressBarStyle}></div>
                    </div>
                    <span class="score-percent">{selectedMatchScore}%</span>
                </div>

                <!-- SLA отдельно -->
                <div if:true={selectedSla} class="sla-centered">
                    <lightning-icon icon-name="utility:clock" size="x-small"></lightning-icon>
                    <span class="sla-label">SLA:</span>
                    <span class={slaTextClass}>{slaText}</span>
                </div>

                <!-- Быстрые действия -->
                <div class="quick-actions">
                    <lightning-button label="Schedule Interview" variant="brand"
                        onclick={openInterviewFlow}></lightning-button>
                    <lightning-button label="Send Message" variant="neutral"
                        onclick={openMessagingModal}></lightning-button>
                </div>

                <!-- Предупреждения -->
                <div if:true={warnings.length} class="warnings">
                    <template for:each={warnings} for:item="warning">
                        <div key={warning} class="warning-item">
                            <lightning-icon icon-name="utility:warning" size="x-small"
                                class="warning-icon"></lightning-icon>
                            <span>{warning}</span>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Модальные окна -->
        <template if:true={showMessagingModal}>
            <div class="modal-backdrop" onclick={closeMessagingModal}>
                <div class="modal-container" onclick={stopPropagation}>
                    <div class="modal-header">
                        <h3>Send Message</h3>
                        <lightning-button-icon icon-name="utility:close" variant="bare"
                            onclick={closeMessagingModal}></lightning-button-icon>
                    </div>
                    <div class="modal-content">
                        <c-messaging-panel record-id={selectedApplicationId}></c-messaging-panel>
                    </div>
                </div>
            </div>
        </template>

        <template if:true={showInterviewFlow}>
            <div class="modal-backdrop" onclick={closeInterviewFlow}>
                <div class="modal-container modal-large" onclick={stopPropagation}>
                    <div class="modal-header">
                        <h3>Schedule Interview</h3>
                        <lightning-button-icon icon-name="utility:close" variant="bare"
                            onclick={closeInterviewFlow}></lightning-button-icon>
                    </div>
                    <div class="modal-content">
                        <lightning-flow flow-api-name="Interview_Scheduling_Flow" flow-input-variables={flowInputs}
                            onstatuschange={handleFlowStatusChange}>
                        </lightning-flow>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
