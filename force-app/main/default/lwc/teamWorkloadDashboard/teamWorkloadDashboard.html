<template>
    <lightning-card title="Team Workload" icon-name="standard:groups">
        <div class="slds-p-around_small">
            <lightning-datatable
                key-field="userId"
                data={teamData}
                columns={columns}
                hide-checkbox-column="true"
                default-sort-direction="asc"
                sorted-by="workloadScore"
                sorted-direction="asc"
                onsort={handleSort}>
            </lightning-datatable>
            <div class="slds-m-top_small slds-text-align_center">
                <lightning-button label="Refresh" variant="neutral" onclick={refreshData}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
